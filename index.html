<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บริษัท สปังกี้ฟู้ด จำกัด · ระบบงานองค์กร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f6fa;
    --surface: #ffffff;
    --ink: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --accent: #2563eb;
    --danger: #dc2626;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 4px 16px rgba(15, 23, 42, .06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif;
    /* พื้นหลังไล่สีแนวเฉียง แดง → ขาว → เขียว ตามโลโก้สปังกี้ฟู้ด */
    background: linear-gradient(135deg, #b8232a 0%, #d94a44 20%, #f3d9d4 42%, #f7f4ee 50%, #d5ead3 58%, #4ea653 80%, #2f8a3a 100%) fixed;
    background-color: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.55;
    min-height: 100vh;
  }
  button { font: inherit; cursor: pointer; }
  svg.ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .hidden { display: none !important; }

  /* ---------- หน้าแรก: เลือกแผนก ---------- */
  .home { max-width: 1160px; margin: 0 auto; padding: 48px 20px 40px; }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .brand-logo { height: 72px; width: auto; flex: none; }
  .brand h1 { font-size: 26px; margin: 0; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; }
  .brand .sys { color: var(--muted); font-size: 14px; font-weight: 500; }
  .home .lead { color: var(--muted); margin: 0; }
  .home-head { background: rgba(255, 255, 255, .92); border-radius: 18px; padding: 18px 22px; margin-bottom: 26px; box-shadow: 0 8px 28px rgba(15, 23, 42, .12); backdrop-filter: blur(6px); }
  .home-foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 24px; }
  .home-foot .home-note, .home-foot .admin-link { margin: 0; background: rgba(255, 255, 255, .92); border-radius: 10px; padding: 8px 14px; box-shadow: 0 4px 14px rgba(15, 23, 42, .10); }
  /* หน้าแผนก/ผู้ดูแล: ใช้พื้นไล่สีเดียวกับหน้าแรก หัวข้อหน้าอยู่ในกล่องขาวให้อ่านชัด */
  .page-head { background: rgba(255, 255, 255, .92); border-radius: 16px; padding: 16px 20px; margin-bottom: 20px; box-shadow: 0 8px 28px rgba(15, 23, 42, .12); backdrop-filter: blur(6px); }
  .page-head h3 { margin: 0 0 2px; }
  .page-head .lead { margin: 0 !important; }
  /* การ์ดผู้บริหาร (Dashboard ทุกฝ่าย) */
  .card.exec-card { flex-direction: row; align-items: center; width: 100%; margin-bottom: 16px; background: linear-gradient(120deg, #2563eb 0%, #4f46e5 45%, #9333ea 100%); color: #fff; border: 0; box-shadow: 0 8px 26px rgba(79, 70, 229, .35); }
  .card.exec-card .icon { background: rgba(255, 255, 255, .2); color: #fff; }
  .card.exec-card .meta { flex: 1; } .card.exec-card .en { color: rgba(255, 255, 255, .78); margin-top: 0; }
  .card.exec-card .go { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13.5px; background: rgba(255, 255, 255, .14); padding: 8px 12px; border-radius: 10px; white-space: nowrap; }
  .exec-card .go svg.ic { width: 16px; height: 16px; }
  .card.exec-card:hover { border-color: transparent; box-shadow: 0 12px 34px rgba(79, 70, 229, .5); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .card {
    position: relative; text-align: left; border: 1px solid var(--line); background: var(--surface);
    border-radius: var(--radius); padding: 22px 22px 18px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 14px; transition: transform .15s, box-shadow .15s, border-color .15s;
    color: inherit; text-decoration: none;
  }
  .card:hover, .card:focus-visible { transform: translateY(-2px); border-color: var(--c); box-shadow: 0 8px 28px rgba(15, 23, 42, .10); outline: none; }
  .card .icon { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 12%, white); }
  .card .icon svg.ic { width: 28px; height: 28px; }
  .card .name { font-size: 18px; font-weight: 600; margin: 0; }
  .card .en { color: var(--muted); font-size: 13px; margin-top: -6px; }
  .card .foot { display: flex; align-items: center; justify-content: space-between; border-top: 1px dashed var(--line); padding-top: 12px; color: var(--muted); font-size: 13px; }
  .card .foot .go { color: var(--c); font-weight: 600; display: flex; align-items: center; gap: 4px; }
  .card .foot svg.ic { width: 16px; height: 16px; }
  .home-note { margin-top: 28px; color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .home-note svg.ic { width: 18px; height: 18px; }

  /* ---------- กล่องกรอกรหัสผ่าน ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); display: grid; place-items: center; padding: 16px; z-index: 10; backdrop-filter: blur(3px); }
  .dialog { width: 100%; max-width: 400px; background: var(--surface); border-radius: 18px; overflow: hidden; box-shadow: 0 24px 64px rgba(15, 23, 42, .25); }
  .dialog-head { padding: 24px 24px 18px; background: color-mix(in srgb, var(--c) 10%, white); display: flex; gap: 14px; align-items: center; }
  .dialog-head .icon { width: 48px; height: 48px; border-radius: 12px; background: var(--c); color: #fff; display: grid; place-items: center; }
  .dialog-head h2 { margin: 0; font-size: 18px; }
  .dialog-head p { margin: 0; color: var(--muted); font-size: 13px; }
  .dialog-body { padding: 22px 24px 24px; }
  label { display: block; font-weight: 500; margin-bottom: 6px; font-size: 14px; }
  .pw { position: relative; }
  .pw input {
    width: 100%; padding: 12px 46px 12px 14px; border: 1.5px solid var(--line); border-radius: 10px; font: inherit; font-size: 16px; background: #fff; color: var(--ink);
  }
  .pw input:focus { outline: none; border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent); }
  .pw .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--muted); padding: 8px; display: grid; }
  .pw .eye svg.ic { width: 20px; height: 20px; }
  .err { color: var(--danger); font-size: 13px; min-height: 20px; margin: 8px 0 4px; }
  .actions { display: flex; gap: 10px; margin-top: 8px; }
  .btn { border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-primary { background: var(--c, var(--accent)); color: #fff; flex: 1; }
  .btn-primary:disabled { opacity: .6; cursor: progress; }
  .btn-ghost { background: #f1f5f9; color: var(--ink); }
  .hint { margin-top: 14px; color: var(--muted); font-size: 12px; display: flex; gap: 6px; }
  .hint svg.ic { width: 16px; height: 16px; margin-top: 1px; }

  /* ---------- หน้าแผนก ---------- */
  .app { min-height: 100vh; display: grid; grid-template-columns: 248px 1fr; grid-template-rows: auto 1fr; }
  .topbar { grid-column: 1 / -1; background: var(--c); color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 14px; }
  .topbar .icon { width: 40px; height: 40px; border-radius: 10px; background: rgba(255, 255, 255, .18); display: grid; place-items: center; }
  .topbar .title { font-weight: 600; font-size: 17px; line-height: 1.3; }
  .topbar .sub { opacity: .85; font-size: 12px; }
  .topbar .spacer { flex: 1; }
  .topbar .lock { font-size: 12px; opacity: .9; display: flex; align-items: center; gap: 6px; }
  .topbar .lock svg.ic { width: 16px; height: 16px; }
  .btn-out { background: rgba(255, 255, 255, .16); color: #fff; border: 1px solid rgba(255, 255, 255, .35); }
  .btn-out:hover { background: rgba(255, 255, 255, .26); }
  .side { background: var(--surface); border-right: 1px solid var(--line); padding: 18px 12px; }
  .side .cap { font-size: 12px; color: var(--muted); padding: 0 12px 8px; text-transform: uppercase; letter-spacing: .04em; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav button { text-align: left; border: 0; background: none; padding: 10px 12px; border-radius: 9px; color: var(--ink); display: flex; gap: 10px; align-items: center; }
  .nav button svg.ic { width: 18px; height: 18px; color: var(--muted); }
  .nav button:hover { background: #f1f5f9; }
  .nav button.active { background: color-mix(in srgb, var(--c) 12%, white); color: var(--c); font-weight: 600; }
  .nav button.active svg.ic { color: var(--c); }
  .main { padding: 28px; max-width: 1000px; width: 100%; }
  .main h3 { margin: 0 0 4px; font-size: 22px; }
  .main .lead { color: var(--muted); margin: 0 0 22px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
  .status { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 20px; }
  .status .dot { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; flex: none; }
  .status.off .dot { background: #fef3c7; color: #b45309; }
  .status.on .dot { background: #dcfce7; color: #15803d; }
  .status b { display: block; }
  .status span { color: var(--muted); font-size: 13px; }
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; gap: 14px; align-items: center; color: inherit; transition: border-color .15s; }
  .tile:hover { border-color: var(--c); }
  .tile .icon { width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 10%, white); }
  .tile .t { font-weight: 600; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: #f1f5f9; color: var(--muted); margin-top: 4px; }
  .empty { text-align: center; padding: 56px 20px; border: 2px dashed var(--line); border-radius: var(--radius); background: var(--surface); color: var(--muted); }
  .empty .icon { width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 14px; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 10%, white); }
  .empty h4 { color: var(--ink); margin: 0 0 6px; font-size: 17px; }

  /* ---------- รหัสผ่าน / ผู้ดูแลระบบ ---------- */
  .link-btn { border: 0; background: none; color: var(--c, var(--accent)); font-weight: 600; padding: 6px 0; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; text-align: left; }
  .link-btn svg.ic { width: 16px; height: 16px; }
  .admin-link { margin-top: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 10px; padding: 8px 14px; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
  .admin-link:hover { color: var(--ink); border-color: #94a3b8; }
  .admin-link svg.ic { width: 16px; height: 16px; }
  .field { margin-top: 12px; }
  .field:first-child { margin-top: 0; }
  .field .pw input { padding-right: 46px; }
  .field input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 10px; font: inherit; font-size: 16px; background: #fff; color: var(--ink); }
  .field input:focus { outline: none; border-color: var(--c, var(--accent)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c, var(--accent)) 18%, transparent); }
  .field input.code { letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
  .note { background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--muted); font-size: 13px; }
  .code-box { font-size: 30px; font-weight: 700; letter-spacing: .14em; text-align: center; padding: 16px 8px; border: 2px dashed var(--c, var(--accent)); border-radius: 12px; color: var(--ink); background: #fff; user-select: all; }
  .arow { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .arow:first-of-type { border-top: 0; }
  .arow .icon { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--dc); background: color-mix(in srgb, var(--dc) 12%, white); flex: none; }
  .arow .info { flex: 1; min-width: 160px; }
  .arow .info b { display: block; }
  .arow .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-sm { padding: 7px 12px; font-size: 13px; border-radius: 9px; }
  .btn-line { background: #fff; border: 1.5px solid var(--line); color: var(--ink); }
  .btn-line:hover { border-color: #94a3b8; }
  .btn-dark { background: var(--ink); color: #fff; }
  .tag { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; margin: 4px 6px 0 0; }
  .tag.ok { background: #dcfce7; color: #15803d; }
  .tag.no { background: #fef3c7; color: #b45309; }
  .tag.lock { background: #fee2e2; color: #b91c1c; }
  .tag.code { background: #e0e7ff; color: #3730a3; }
  .form-panel { max-width: 440px; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 14px; z-index: 20; box-shadow: var(--shadow); }
  .spinner { width: 18px; height: 18px; border: 2.5px solid rgba(255, 255, 255, .4); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 1000px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
    .side { border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 16px; overflow-x: auto; }
    .side .cap { display: none; }
    .nav { flex-direction: row; gap: 6px; }
    .nav button { white-space: nowrap; background: #f1f5f9; }
    .main { padding: 20px 16px; }
  }
  @media (max-width: 560px) {
    .home { padding: 28px 16px; }
    .brand-logo { height: 56px; }
    .brand h1 { font-size: 20px; }
    .grid, .tiles { grid-template-columns: 1fr; }
    .card { flex-direction: row; align-items: center; padding: 16px; gap: 14px; }
    .card .meta { flex: 1; }
    .card .en { margin-top: 0; }
    .card .foot { display: none; }
    .card.exec-card .go { font-size: 0; padding: 8px; gap: 0; } .exec-card .go svg.ic:first-child { display: none; }
    .topbar { padding: 12px 16px; gap: 10px; }
    .topbar .title { font-size: 15px; }
    .btn-out .lbl { display: none; }
    .btn-out { padding: 10px; }
    .topbar .lock { display: none; }
  }
</style>
</head>

<!-- หน้าแรก -->

  <div class="home-head">

      <div class="err" id="mErr"></div>
      <div class="actions">
        <button type="button" class="btn btn-ghost" id="mCancel">ยกเลิก</button>
        <button type="submit" class="btn btn-primary" id="mOk">ตกลง</button>
      </div>
      <div id="mFoot"></div>
    </div>
  </form>
</div>

<!-- หน้าแผนก -->
<section id="app" class="app hidden">
  <header class="topbar">
    <div class="icon" id="topIcon"></div>
    <div>
      <div class="title" id="topTitle"></div>
      <div class="sub" id="topSub"></div>
    </div>
    <div class="spacer"></div>
    <div class="lock"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>ไม่ใช้งาน 30 นาที ออกจากระบบอัตโนมัติ</div>
    <button class="btn btn-out" id="logoutBtn" aria-label="ออกจากระบบ" title="ออกจากระบบ"><svg class="ic" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span class="lbl">ออกจากระบบ</span></button>
  </header>
  <aside class="side">
    <div class="cap">เมนู</div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main" id="main"></main>
</section>

<div id="toast" class="toast hidden"></div>

<script>
  var ICONS = {
    HR: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    ACC: '<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8"/><path d="M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h.01M12 19h4"/>',
    PUR: '<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/><path d="M7.5 5.5l9 5"/>',
    QA: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>',
    RD: '<path d="M9 3h6"/><path d="M10 3v6L4.5 19a2 2 0 0 0 1.8 3h11.4a2 2 0 0 0 1.8-3L14 9V3"/><path d="M7 15h10"/>',
    PROD: '<path d="M2 21h20"/><path d="M3 21V11l6 4v-4l6 4V9"/><path d="M15 21V5h4l1 16"/><path d="M7 18h2M12 18h2"/>',
    SHE: '<path d="M2 18a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v2z"/><path d="M10 10V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5"/><path d="M4 15v-3a6 6 0 0 1 6-6"/><path d="M14 6a6 6 0 0 1 6 6v3"/>',
    LOG: '<path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>',
    COST: '<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8v4H8z"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/>',
    SALES: '<path d="M3 3h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 1.9-1.4L21 8H6"/><circle cx="10" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/>',
    EXEC: '<path d="M3 3v18h18"/><path d="M7 16v-4M11 16V8M15 16v-6M19 16V6"/>',
    home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
    form: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>',
    sheet: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>',
    arrow: '<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>',
    lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
    check: '<path d="M20 6L9 17l-5-5"/>',
    key: '<circle cx="8" cy="15" r="4"/><path d="M10.85 12.15L19 4"/><path d="M18 5l3 3"/><path d="M15 8l3 3"/>',
    gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
    copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>',
    warn: '<path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>'
  };
  function icon(name, size) {
    var s = size ? ' style="width:' + size + 'px;height:' + size + 'px"' : '';
    return '<svg class="ic" viewBox="0 0 24 24"' + s + '>' + (ICONS[name] || '') + '</svg>';
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(id) { return document.getElementById(id); }

  // ตั๋วเก็บในหน่วยความจำเท่านั้น (ไม่ใช้ localStorage/cookie) — ปิด/รีเฟรชหน้า = ต้องกรอกรหัสใหม่
  var state = { depts: [], picked: null, token: null, dept: null, page: 'home', single: false, admin: false, adminData: null };
  var ADMIN_COLOR = '#0f172a';

  // หน้าเว็บนี้อยู่บน GitHub Pages — ข้อมูล/รหัสผ่านทำงานที่ Google Apps Script (Api.gs ใน repo apps-script/departments)
  var API_URL = 'https://script.google.com/macros/s/AKfycbyWj0ra2zC_T-qOE6kAr0cHHzIV944lk_5n4Nk54md9WkHcslA_Pwx7UBNF5Uc0LXTc/exec';
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (res) { if (!res.ok) throw new Error(res.err || 'เกิดข้อผิดพลาด'); return res.val; });
  }
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.add('hidden'); }, 3200);
  }

  // ---------- หน้าแรก ----------
  function renderHome() {
    // การ์ดผู้บริหาร (Dashboard ทุกฝ่าย) แยกไว้ด้านบน
    $('execSlot').innerHTML = state.depts.filter(function (d) { return d.exec; }).map(function (d) {
      return '<button class="card exec-card" style="--c:' + d.color + '" data-key="' + d.key + '"><div class="icon">' + icon('EXEC') + '</div>'
        + '<div class="meta"><p class="name">Dashboard ผู้บริหาร</p><div class="en">ดูข้อมูลสรุปของทุกฝ่าย · เลือกฝ่ายและช่วงวันที่ได้</div></div>'
        + '<span class="go">' + icon('lock', 15) + 'ใช้รหัสผู้บริหาร ' + icon('arrow') + '</span></button>';
    }).join('');
    $('grid').innerHTML = state.depts.filter(function (d) { return !d.exec; }).map(function (d) {
      // แผนกที่ย้ายไปใช้ระบบของตัวเองแล้ว (แบบ 2) — การ์ดเป็นลิงก์ไประบบของแผนกนั้น
      var open = d.appUrl
        ? '<a class="card" style="--c:' + d.color + '" href="' + esc(d.appUrl) + '" target="_top">'
        : '<button class="card" style="--c:' + d.color + '" data-key="' + d.key + '">';
      return open +
        '<div class="icon">' + icon(d.key) + '</div>' +
        '<div class="meta"><p class="name">' + esc(d.name) + '</p><div class="en">' + esc(d.en) + '</div></div>' +
        '<div class="foot"><span style="display:flex;gap:6px;align-items:center">' + icon('lock', 15) + 'ใช้รหัสผ่านแผนก</span>' +
        '<span class="go">เข้าสู่ระบบ ' + icon('arrow') + '</span></div>' + (d.appUrl ? '</a>' : '</button>');
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('button.card'), function (el) {
      el.addEventListener('click', function () { openLogin(el.getAttribute('data-key')); });
    });
  }

  function openLogin(key) {
    var d = state.depts.filter(function (x) { return x.key === key; })[0];
    state.picked = d;
    if (d.ready === false) { openDeptSetup(d, true); return; }
    var dlg = $('loginForm');
    dlg.style.setProperty('--c', d.color);
    $('loginIcon').innerHTML = icon(d.key, 26);
    $('loginTitle').textContent = d.name;
    $('loginEn').textContent = d.en;
    $('pwInput').value = ''; $('pwInput').type = 'password';
    $('loginErr').textContent = '';
    $('loginOverlay').classList.remove('hidden');
    setTimeout(function () { $('pwInput').focus(); }, 30);
  }
  function closeLogin() { if (state.single && !state.token) return; $('loginOverlay').classList.add('hidden'); $('pwInput').value = ''; }

  $('cancelBtn').addEventListener('click', closeLogin);
  $('loginOverlay').addEventListener('click', function (e) { if (e.target === this) closeLogin(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLogin(); });
  $('eyeBtn').addEventListener('click', function () { var i = $('pwInput'); i.type = i.type === 'password' ? 'text' : 'password'; i.focus(); });

  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('loginBtn'), pw = $('pwInput').value;
    if (!pw) { $('loginErr').textContent = 'กรุณากรอกรหัสผ่าน'; return; }
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>กำลังตรวจสอบ';
    $('loginErr').textContent = '';
    call('login', state.picked.key, pw).then(function (res) {
      if (!res.ok) {
        if (res.needSetup) { $('loginOverlay').classList.add('hidden'); openDeptSetup(state.picked, true); return; }
        $('loginErr').textContent = res.error; $('pwInput').select(); return;
      }
      state.token = res.token; state.dept = res.dept;
      closeLogin();
      openApp();
    }).catch(function () {
      $('loginErr').textContent = 'เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง';
    }).then(function () { btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ'; });
  });

  // ---------- หน้าแผนก ----------
  function openApp() {
    var d = state.dept;
    $('app').style.setProperty('--c', d.color);
    $('topIcon').innerHTML = icon(d.key, 22);
    $('topTitle').textContent = d.name;
    $('topSub').textContent = d.en;
    $('home').classList.add('hidden');
    $('app').classList.remove('hidden');
    state.page = deptModule() ? deptModule().menus()[0].id : 'home';
    if (deptModule()) deptModule().reset();
    renderNav(); renderPage();
    call('getDepartmentHome', state.token).then(function (res) {
      state.dept = res.dept; if (state.page === 'home') renderPage();
    }).catch(onServerError);
  }

  function renderNav() {
    var items = state.admin
      ? [{ id: 'adm', label: 'แผนก / รหัสตั้งค่า', ic: 'home' }, { id: 'admpw', label: 'เปลี่ยนรหัสผู้ดูแล', ic: 'key' }]
      : (deptModule() ? deptModule().menus() : [{ id: 'home', label: 'หน้าหลัก', ic: 'home' }].concat(state.dept.menus.map(function (m, i) {
          return { id: 'm' + i, label: m, ic: 'form' };
        }))).concat([{ id: 'pw', label: 'เปลี่ยนรหัสผ่าน', ic: 'key' }]);
    $('nav').innerHTML = items.map(function (it) {
      return '<button data-page="' + it.id + '" class="' + (state.page === it.id ? 'active' : '') + '">' + icon(it.ic) + esc(it.label) + '</button>';
    }).join('');
    Array.prototype.forEach.call($('nav').querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () { go(b.getAttribute('data-page')); });
    });
  }
  function go(page) { state.page = page; renderNav(); renderPage(); window.scrollTo(0, 0); }
  // แผนกที่มีระบบงานแล้ว (โมดูล) — เช่น PUR = purchasing.js
  function deptModule() { var m = state.dept && state.dept.module; return (m === 'purchasing' && window.PUR) || (m === 'executive' && window.EXEC) || null; }

  function renderPage() {
    if (state.admin) { renderAdminPage(); return; }
    var d = state.dept, html;
    if (state.page === 'pw') { renderChangePw(); return; }
    if (deptModule()) { deptModule().render(state.page); return; }
    if (state.page === 'home') {
      var s = d.sheet;
      var status = !s
        ? '<div class="panel status off"><div class="dot">' + icon('sheet', 20) + '</div><div><b>กำลังตรวจสอบ Google Sheet…</b></div></div>'
        : s.connected
          ? '<div class="panel status on"><div class="dot">' + icon('check', 20) + '</div><div><b>เชื่อม Google Sheet แล้ว: ' + esc(s.title) + '</b><span>แท็บ: ' + esc(s.tabs.join(', ')) + '</span></div></div>'
          : '<div class="panel status off"><div class="dot">' + icon('warn', 20) + '</div><div><b>' + esc(s.message) + '</b><span>ผู้ดูแลระบบจะใส่ Sheet ID ของแผนกนี้ภายหลัง' + (d.ownerEmail ? ' · เจ้าของข้อมูล: ' + esc(d.ownerEmail) : '') + '</span></div></div>';
      html = '<h3>ยินดีต้อนรับ ' + esc(d.name) + '</h3><p class="lead">เลือกเมนูที่ต้องการทำงาน</p>' + status +
        '<div class="tiles">' + d.menus.map(function (m, i) {
          return '<button class="tile" data-page="m' + i + '"><div class="icon">' + icon('form') + '</div><div><div class="t">' + esc(m) + '</div><span class="badge">รอกำหนดฟอร์ม</span></div></button>';
        }).join('') + '</div>';
    } else {
      var label = d.menus[Number(state.page.slice(1))];
      html = '<h3>' + esc(label) + '</h3><p class="lead">' + esc(d.name) + '</p>' +
        '<div class="empty"><div class="icon">' + icon('form', 28) + '</div><h4>หน้านี้จะเป็นฟอร์มกรอกข้อมูล</h4>' +
        '<div>รอกำหนดหัวข้อข้อมูลและเชื่อม Google Sheet ของแผนก</div></div>';
    }
    $('main').innerHTML = html;
    Array.prototype.forEach.call($('main').querySelectorAll('.tile'), function (b) {
      b.addEventListener('click', function () { go(b.getAttribute('data-page')); });
    });
  }

  function backToHome(msg) {
    state.token = null; state.dept = null; state.admin = false; state.adminData = null;
    if (window.PUR) window.PUR.reset();
    if (window.EXEC) window.EXEC.reset();
    closeModal();
    $('app').classList.add('hidden'); $('home').classList.remove('hidden');
    if (msg) toast(msg);
    if (state.single) openLogin(state.depts[0].key);
  }
  function onServerError(err) {
    if (String(err && err.message || err).indexOf('SESSION_EXPIRED') >= 0) backToHome('หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบใหม่');
    else toast('เกิดข้อผิดพลาด: ' + (err && err.message || err));
  }
  $('logoutBtn').addEventListener('click', function () {
    var t = state.token; backToHome('ออกจากระบบแล้ว');
    call('logout', t).catch(function () {});
  });

  // ---------- กล่องทั่วไป ----------
  var modalCfg = null;
  function field(id, label, type, ph, cls) {
    var inp = '<input id="' + id + '" type="' + (type || 'password') + '" autocomplete="' + (type === 'text' ? 'off' : 'new-password') + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : '') + (cls ? ' class="' + cls + '"' : '') + '>';
    // ช่องรหัสผ่าน: มีปุ่มรูปตา กดเพื่อแสดง/ซ่อนรหัส
    if (!type || type === 'password') inp = '<div class="pw">' + inp + '<button type="button" class="eye feye" tabindex="-1" aria-label="แสดงรหัสผ่าน">' + $('eyeBtn').innerHTML + '</button></div>';
    return '<div class="field"><label for="' + id + '">' + label + '</label>' + inp + '</div>';
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.feye'); if (!b) return;
    var i = b.parentNode.querySelector('input'); i.type = i.type === 'password' ? 'text' : 'password'; i.focus();
  });
  function val(id) { var el = $(id); return el ? el.value : ''; }
  function openModal(cfg) {
    modalCfg = cfg;
    $('modalForm').style.setProperty('--c', cfg.color || ADMIN_COLOR);
    $('modalForm').classList.toggle('wide', !!cfg.wide);
    $('mIcon').innerHTML = icon(cfg.icon || 'lock', 26);
    $('mTitle').textContent = cfg.title || '';
    $('mSub').textContent = cfg.sub || '';
    $('mBody').innerHTML = cfg.body || '';
    $('mFoot').innerHTML = cfg.foot || '';
    $('mErr').textContent = '';
    $('mOk').textContent = cfg.ok || 'ตกลง';
    $('mOk').classList.toggle('hidden', !!cfg.noOk);
    $('mCancel').textContent = cfg.cancel || 'ยกเลิก';
    $('mCancel').classList.toggle('hidden', !!cfg.noCancel);
    $('modalOverlay').classList.remove('hidden');
    if (cfg.onOpen) cfg.onOpen();
    setTimeout(function () { var f = $('mBody').querySelector('input'); if (f) f.focus(); }, 30);
  }
  function closeModal() { $('modalOverlay').classList.add('hidden'); $('mBody').innerHTML = ''; modalCfg = null; }
  function cancelModal() {
    var cfg = modalCfg; closeModal();
    if (cfg && cfg.onCancel) cfg.onCancel();
  }
  $('mCancel').addEventListener('click', cancelModal);
  $('modalOverlay').addEventListener('click', function (e) { if (e.target === this && !(modalCfg && modalCfg.sticky)) cancelModal(); });
  $('modalForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!modalCfg || !modalCfg.submit) { closeModal(); return; }
    var btn = $('mOk'), label = btn.textContent, cfg = modalCfg;
    $('mErr').textContent = '';
    var pre = cfg.check ? cfg.check() : '';
    if (pre) { $('mErr').textContent = pre; return; }
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>กำลังทำงาน';
    Promise.resolve(cfg.submit()).then(function (err) {
      if (err && modalCfg === cfg) $('mErr').textContent = err;
    }).catch(function (e2) {
      if (String(e2 && e2.message || e2).indexOf('SESSION_EXPIRED') >= 0) { backToHome('หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบใหม่'); return; }
      $('mErr').textContent = 'เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง';
    }).then(function () { btn.disabled = false; if (modalCfg === cfg) btn.textContent = label; });
  });
  function pwPairError(a, b) {
    if (String(a).length < 6) return 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';
    if (a !== b) return 'รหัสผ่านใหม่ 2 ช่องไม่ตรงกัน';
    return '';
  }

  // ---------- แผนก: ตั้ง/รีเซ็ตรหัสผ่านด้วยรหัสตั้งค่า ----------
  function openDeptSetup(d, first) {
    openModal({
      color: d.color, icon: d.key, title: (d.ready === false ? 'ตั้งรหัสผ่านครั้งแรก · ' : 'ตั้ง / รีเซ็ตรหัสผ่าน · ') + d.name, sub: d.en,
      body: '<div class="note" style="margin-bottom:12px">' + (d.ready === false ? (d.exec ? 'ผู้บริหารยังไม่มีรหัสผ่าน' : 'แผนกนี้ยังไม่มีรหัสผ่าน') + ' — ' : '')
          + 'ขอ <b>รหัสตั้งค่า 8 ตัว</b> (หน้าตาแบบ ABCD-2345) จากผู้ดูแลระบบ ใส่ในช่องแรก แล้วตั้งรหัสผ่านของ' + (d.exec ? 'ตัวเอง' : 'แผนกเอง') + 'ในช่องถัดไป</div>'
        + field('mCode', 'รหัสตั้งค่า 8 ตัว จากผู้ดูแลระบบ (ไม่ใช่รหัสผ่าน)', 'text', 'เช่น ABCD-2345', 'code')
        + field('mPw1', 'รหัสผ่านใหม่' + (d.exec ? '' : 'ของแผนก') + ' (อย่างน้อย 6 ตัวอักษร)')
        + field('mPw2', 'พิมพ์รหัสผ่านใหม่อีกครั้ง'),
      foot: '<div class="hint">' + icon('lock') + 'รหัสผ่านนี้รู้เฉพาะคนในแผนก ผู้ดูแลระบบไม่เห็นและตั้งแทนไม่ได้ · รหัสตั้งค่าใช้ได้ครั้งเดียว</div>',
      ok: 'ตั้งรหัสและเข้าสู่ระบบ', sticky: state.single,
      noCancel: state.single && d.ready === false,
      onCancel: function () { if (state.single || (d.ready !== false && !first)) openLogin(d.key); },
      check: function () { return val('mCode').replace(/[^A-Za-z0-9]/g, '').length !== 8 ? 'ช่องแรกต้องเป็นรหัสตั้งค่า 8 ตัว (เช่น ABCD-2345) ที่ผู้ดูแลระบบออกให้ — ยังไม่มี ให้ขอจากผู้ดูแลระบบก่อน' : pwPairError(val('mPw1'), val('mPw2')); },
      submit: function () {
        return call('deptSetPasswordWithCode', d.key, val('mCode'), val('mPw1')).then(function (r) {
          if (!r.ok) return r.error;
          d.ready = true; state.token = r.token; state.dept = r.dept;
          closeModal(); $('loginOverlay').classList.add('hidden');
          openApp(); toast('ตั้งรหัสผ่านของแผนกแล้ว');
        });
      }
    });
  }
  $('setupLink').addEventListener('click', function () { var d = state.picked; $('loginOverlay').classList.add('hidden'); openDeptSetup(d, false); });

  // ---------- แผนก: เปลี่ยนรหัสผ่านเอง ----------
  function renderChangePw() {
    var d = state.dept;
    $('main').innerHTML = '<h3>เปลี่ยนรหัสผ่าน</h3><p class="lead">' + esc(d.name) + ' · รหัสผ่านรู้เฉพาะคนในแผนก ผู้ดูแลระบบไม่เห็น</p>'
      + '<form class="panel form-panel" id="cpForm" autocomplete="off">' + field('cpOld', 'รหัสผ่านปัจจุบัน') + field('cpNew1', 'รหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร)') + field('cpNew2', 'พิมพ์รหัสผ่านใหม่อีกครั้ง')
      + '<div class="err" id="cpErr"></div><div class="actions"><button type="submit" class="btn btn-primary" id="cpBtn">บันทึกรหัสผ่านใหม่</button></div>'
      + '<div class="hint">' + icon('warn') + 'เปลี่ยนแล้ว เครื่องอื่นที่เข้าแผนกนี้ค้างไว้จะถูกออกจากระบบ ต้องใช้รหัสใหม่</div></form>';
    $('cpForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var err = val('cpOld') ? pwPairError(val('cpNew1'), val('cpNew2')) : 'กรอกรหัสผ่านปัจจุบัน';
      if (err) { $('cpErr').textContent = err; return; }
      var btn = $('cpBtn'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>กำลังบันทึก'; $('cpErr').textContent = '';
      call('changeMyPassword', state.token, val('cpOld'), val('cpNew1')).then(function (r) {
        if (!r.ok) { $('cpErr').textContent = r.error; return; }
        state.token = r.token; toast('เปลี่ยนรหัสผ่านแล้ว'); go('home');
      }).catch(onServerError).then(function () { if ($('cpBtn')) { btn.disabled = false; btn.textContent = 'บันทึกรหัสผ่านใหม่'; } });
    });
  }

  // ---------- ผู้ดูแลระบบ ----------
  $('adminLink').addEventListener('click', function () {
    call('getAdminStatus').then(function (st) { st.hasAdmin ? openAdminLogin(st) : openAdminEmailStep(st, true); })
      .catch(function () { toast('เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง'); });
  });
  function openAdminLogin(st) {
    openModal({
      icon: 'gear', title: 'ผู้ดูแลระบบ', sub: 'ออกรหัสตั้งค่าให้แผนก · ปลดล็อก',
      body: field('adPw', 'รหัสผู้ดูแลระบบ'), ok: 'เข้าสู่ระบบ',
      foot: '<button type="button" class="link-btn" id="adForgot">' + icon('key') + 'ลืมรหัส? ส่งรหัสยืนยันไปที่ ' + esc(st.email) + '</button>',
      onOpen: function () { $('adForgot').addEventListener('click', function () { openAdminEmailStep(st, false); }); },
      check: function () { return val('adPw') ? '' : 'กรอกรหัสผู้ดูแลระบบ'; },
      submit: function () {
        return call('adminLogin', val('adPw')).then(function (r) { if (!r.ok) return r.error; closeModal(); openAdmin(r.token); });
      }
    });
  }
  function openAdminEmailStep(st, first) {
    openModal({
      icon: 'gear', title: first ? 'ตั้งรหัสผู้ดูแลระบบครั้งแรก' : 'รีเซ็ตรหัสผู้ดูแลระบบ', sub: 'ยืนยันตัวตนด้วยอีเมลเจ้าของระบบ',
      body: '<div class="note">ระบบจะส่งรหัสยืนยัน 6 หลักไปที่อีเมลเจ้าของระบบ <b>' + esc(st.email) + '</b> (ใช้ได้ 10 นาที)</div>',
      ok: 'ส่งรหัสยืนยัน',
      submit: function () {
        return call('adminSendEmailCode').then(function (r) { if (!r.ok) return r.error; openAdminCodeStep(st, first); });
      }
    });
  }
  function openAdminCodeStep(st, first) {
    openModal({
      icon: 'gear', title: first ? 'ตั้งรหัสผู้ดูแลระบบครั้งแรก' : 'รีเซ็ตรหัสผู้ดูแลระบบ', sub: 'ส่งรหัสยืนยันไปที่ ' + st.email + ' แล้ว',
      body: field('adCode', 'รหัสยืนยัน 6 หลักจากอีเมล', 'text', '123456', 'code') + field('adPw1', 'รหัสผู้ดูแลระบบใหม่ (อย่างน้อย 6 ตัวอักษร)') + field('adPw2', 'พิมพ์รหัสใหม่อีกครั้ง'),
      ok: 'บันทึกและเข้าสู่ระบบ',
      foot: '<button type="button" class="link-btn" id="adResend">' + icon('key') + 'ไม่ได้รับอีเมล? ส่งรหัสใหม่</button>',
      onOpen: function () { $('adResend').addEventListener('click', function () { openAdminEmailStep(st, first); }); },
      check: function () { return val('adCode').replace(/\D/g, '').length !== 6 ? 'กรอกรหัสยืนยัน 6 หลัก' : pwPairError(val('adPw1'), val('adPw2')); },
      submit: function () {
        return call('adminSetPasswordWithEmailCode', val('adCode'), val('adPw1')).then(function (r) {
          if (!r.ok) return r.error; closeModal(); openAdmin(r.token); toast('ตั้งรหัสผู้ดูแลระบบแล้ว');
        });
      }
    });
  }
  function openAdmin(token) {
    state.token = token; state.admin = true; state.dept = null; state.page = 'adm';
    $('app').style.setProperty('--c', ADMIN_COLOR);
    $('topIcon').innerHTML = icon('gear', 22);
    $('topTitle').textContent = 'ผู้ดูแลระบบ';
    $('topSub').textContent = 'ออกรหัสตั้งค่าให้แผนก · ไม่เห็นรหัสผ่านของแผนก';
    $('home').classList.add('hidden'); $('app').classList.remove('hidden');
    renderNav(); renderPage(); loadAdmin();
  }
  function loadAdmin() {
    call('adminOverview', state.token).then(function (r) { state.adminData = r.depts; if (state.page === 'adm') renderPage(); }).catch(onServerError);
  }
  function fmtDate(ms) { var d = new Date(ms); return d.getDate() + '/' + (d.getMonth() + 1) + '/' + (d.getFullYear() + 543) + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function renderAdminPage() {
    if (state.page === 'admpw') {
      $('main').innerHTML = '<h3>เปลี่ยนรหัสผู้ดูแลระบบ</h3><p class="lead">ลืมรหัส: หน้าแรก → ผู้ดูแลระบบ → ส่งรหัสยืนยันทางอีเมล</p>'
        + '<form class="panel form-panel" id="apForm" autocomplete="off">' + field('apOld', 'รหัสปัจจุบัน') + field('apNew1', 'รหัสใหม่ (อย่างน้อย 6 ตัวอักษร)') + field('apNew2', 'พิมพ์รหัสใหม่อีกครั้ง')
        + '<div class="err" id="apErr"></div><div class="actions"><button type="submit" class="btn btn-primary" id="apBtn">บันทึกรหัสใหม่</button></div></form>';
      $('apForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var err = val('apOld') ? pwPairError(val('apNew1'), val('apNew2')) : 'กรอกรหัสปัจจุบัน';
        if (err) { $('apErr').textContent = err; return; }
        var btn = $('apBtn'); btn.disabled = true; $('apErr').textContent = '';
        call('adminChangePassword', state.token, val('apOld'), val('apNew1')).then(function (r) {
          if (!r.ok) { $('apErr').textContent = r.error; return; }
          state.token = r.token; toast('เปลี่ยนรหัสผู้ดูแลระบบแล้ว'); go('adm');
        }).catch(onServerError).then(function () { if ($('apBtn')) btn.disabled = false; });
      });
      return;
    }
    var list = state.adminData;
    var html = '<h3>แผนก / รหัสตั้งค่า</h3><p class="lead">ผู้ดูแลระบบไม่เห็นและตั้งรหัสผ่านของแผนกไม่ได้ ทำได้แค่ออก "รหัสตั้งค่า" ให้แผนกไปตั้งรหัสผ่านเอง</p>';
    if (!list) { $('main').innerHTML = html + '<div class="panel">กำลังโหลด…</div>'; return; }
    html += '<div class="panel">' + list.map(function (d) {
      var tags = !d.managed ? '<span class="tag code">ย้ายไปใช้ระบบของแผนกเองแล้ว</span>'
        : (d.hasPassword ? '<span class="tag ok">ตั้งรหัสผ่านแล้ว</span>' : '<span class="tag no">ยังไม่ตั้งรหัสผ่าน</span>')
          + (d.locked ? '<span class="tag lock">ล็อกอยู่ (ใส่รหัสผิดหลายครั้ง)</span>' : '')
          + (d.codeExpires ? '<span class="tag code">มีรหัสตั้งค่ารอใช้ ถึง ' + fmtDate(d.codeExpires) + '</span>' : '')
          + (!d.links ? '' : d.links.sheetId
            ? (d.links.sheetError ? '<span class="tag lock">Sheet เปิดไม่ได้</span>' : '<span class="tag ok">Sheet: ' + esc(d.links.sheet) + '</span>')
            : '<span class="tag no">ยังไม่ตั้ง Sheet</span>')
          + (d.links && d.links.folderId ? (d.links.folderError ? '<span class="tag lock">โฟลเดอร์เปิดไม่ได้</span>' : '<span class="tag ok">โฟลเดอร์: ' + esc(d.links.folder) + '</span>') : '');
      var btns = !d.managed ? '' : '<button type="button" class="btn btn-sm btn-dark" data-act="issue" data-key="' + d.key + '">' + (d.hasPassword ? 'ออกรหัสรีเซ็ต' : 'ออกรหัสตั้งค่า') + '</button>'
        + (d.codeExpires ? '<button type="button" class="btn btn-sm btn-line" data-act="cancel" data-key="' + d.key + '">ยกเลิกรหัส</button>' : '')
        + (d.locked ? '<button type="button" class="btn btn-sm btn-line" data-act="unlock" data-key="' + d.key + '">ปลดล็อก</button>' : '')
        + (d.exec ? '' : '<button type="button" class="btn btn-sm btn-line" data-act="links" data-key="' + d.key + '">ลิงก์ Sheet / โฟลเดอร์</button>');
      return '<div class="arow" style="--dc:' + d.color + '"><div class="icon">' + icon(d.key) + '</div><div class="info"><b>' + esc(d.name) + '</b>' + tags + '</div><div class="btns">' + btns + '</div></div>';
    }).join('') + '</div>';
    $('main').innerHTML = html;
    Array.prototype.forEach.call($('main').querySelectorAll('[data-act]'), function (b) {
      b.addEventListener('click', function () { adminAction(b.getAttribute('data-act'), b.getAttribute('data-key')); });
    });
  }
  function adminAction(act, key) {
    var d = (state.adminData || []).filter(function (x) { return x.key === key; })[0];
    if (!d) return;
    if (act === 'unlock') { call('adminUnlockDept', state.token, key).then(function () { toast('ปลดล็อก ' + d.name + ' แล้ว'); loadAdmin(); }).catch(onServerError); return; }
    if (act === 'links') { openDeptLinks(d); return; }
    if (act === 'cancel') { call('adminCancelDeptCode', state.token, key).then(function () { toast('ยกเลิกรหัสตั้งค่าแล้ว'); loadAdmin(); }).catch(onServerError); return; }
    openModal({
      color: d.color, icon: d.key, title: (d.hasPassword ? 'ออกรหัสรีเซ็ต · ' : 'ออกรหัสตั้งค่า · ') + d.name, sub: d.en,
      body: '<div class="note">' + (d.hasPassword
        ? 'ใช้เมื่อแผนกลืมรหัสผ่าน — แผนกเอารหัสนี้ไปตั้งรหัสผ่านใหม่เอง รหัสผ่านเดิมยังใช้ได้จนกว่าแผนกจะตั้งใหม่'
        : 'แผนกเอารหัสนี้ไปตั้งรหัสผ่านของตัวเองในหน้าเว็บ') + (d.codeExpires ? '<br><b>รหัสตั้งค่าเดิมที่ยังไม่ได้ใช้จะถูกยกเลิก</b>' : '') + '</div>',
      ok: 'ออกรหัส',
      submit: function () {
        return call('adminIssueDeptCode', state.token, key).then(function (r) {
          if (!r.ok) return r.error;
          loadAdmin();
          openModal({
            color: d.color, icon: d.key, title: 'รหัสตั้งค่า · ' + d.name, sub: 'ส่งให้หัวหน้าแผนกด้วยตัวเอง',
            body: '<div class="code-box" id="codeBox">' + esc(r.code) + '</div>'
              + '<div class="note" style="margin-top:12px">ใช้ได้ครั้งเดียว ถึง ' + fmtDate(r.expires) + ' · ปิดหน้านี้แล้วจะดูรหัสนี้อีกไม่ได้ (ออกใหม่ได้)<br>แผนกกดการ์ดแผนก → "ตั้ง / รีเซ็ตรหัสผ่าน" → ใส่รหัสนี้ แล้วตั้งรหัสผ่านเอง</div>',
            ok: 'คัดลอกรหัส', cancel: 'ปิด',
            submit: function () {
              var t = r.code;
              if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t).then(function () { toast('คัดลอกรหัสแล้ว'); }, function () { toast('คัดลอกไม่ได้ กดค้างที่รหัสเพื่อคัดลอก'); });
              toast('กดค้างที่รหัสเพื่อคัดลอก');
            }
          });
        });
      }
    });
  }

  // ลิงก์ Google Sheet / โฟลเดอร์ไฟล์ของแผนก (เก็บใน Script Properties ไม่อยู่ในโค้ด)
  function openDeptLinks(d) {
    var l = d.links || {};
    var st = function (id, err, name) { return !id ? '' : err ? '<div class="err" style="min-height:0">' + esc(err) + '</div>' : '<div class="note" style="margin-top:6px">✓ เปิดได้: ' + esc(name) + '</div>'; };
    openModal({
      color: d.color, icon: d.key, title: 'ลิงก์ข้อมูล · ' + d.name, sub: 'วางลิงก์ที่คัดลอกจาก Google Sheet / Google Drive',
      body: '<div class="note">เจ้าของไฟล์ต้องแชร์ให้บัญชีระบบ (เจ้าของสคริปต์) เป็น <b>ผู้แก้ไข</b> ก่อน · เว้นว่าง = ยกเลิกลิงก์</div>'
        + field('lkSheet', 'ลิงก์ Google Sheet ของแผนก', 'text', 'https://docs.google.com/spreadsheets/d/…') + st(l.sheetId, l.sheetError, l.sheet)
        + field('lkFolder', 'ลิงก์โฟลเดอร์เก็บไฟล์แนบ (Google Drive)', 'text', 'https://drive.google.com/drive/folders/…') + st(l.folderId, l.folderError, l.folder),
      ok: 'บันทึกและตรวจสอบ',
      onOpen: function () {
        if (l.sheetId) $('lkSheet').value = 'https://docs.google.com/spreadsheets/d/' + l.sheetId + '/edit';
        if (l.folderId) $('lkFolder').value = 'https://drive.google.com/drive/folders/' + l.folderId;
      },
      submit: function () {
        return call('adminSetDeptLinks', state.token, d.key, val('lkSheet'), val('lkFolder')).then(function (r) {
          if (!r.ok) return r.error;
          d.links = r.links; loadAdmin();
          var e = r.links.sheetError || r.links.folderError;
          if (e) { openDeptLinks(d); return; }
          closeModal(); toast('บันทึกลิงก์แล้ว — ระบบเปิดได้');
        });
      }
    });
  }

  // ครอบหัวข้อหน้า (h3 + คำอธิบาย) ด้วยกล่องขาว ทุกครั้งที่เปลี่ยนหน้า
  new MutationObserver(function () {
    var m = $('main'), h = m.firstElementChild;
    if (!h || h.tagName !== 'H3') return;
    var box = document.createElement('div'); box.className = 'page-head';
    m.insertBefore(box, h); box.appendChild(h);
    var next = box.nextElementSibling;
    if (next && next.classList.contains('lead')) box.appendChild(next);
  }).observe($('main'), { childList: true });

  call('getDepartments').then(function (list) {
    state.depts = list; renderHome();
    // ระบบของแผนกเดียว (แบบ 2): เปิดหน้ากรอกรหัสทันที
    if (list.length === 1 && !list[0].appUrl) {
      state.single = true; $('cancelBtn').classList.add('hidden'); openLogin(list[0].key);
    }
  }).catch(function () { toast('โหลดรายชื่อแผนกไม่ได้'); });
</script>
<script src="purchasing.js?v=6"></script>
<script src="executive.js?v=2"></script>
</body>
</html>
