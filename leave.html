<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ขอลา · Spunky Food</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --c: #2563eb; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --bg: #f1f5f9; --ok: #16a34a; --bad: #dc2626; --warn: #d97706; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans Thai', 'Noto Sans Myanmar', system-ui, sans-serif; font-size: 16px; }
  body.my { font-family: 'Noto Sans Myanmar', 'IBM Plex Sans Thai', system-ui, sans-serif; }
  .top { background: linear-gradient(135deg, #1d4ed8, #3b82f6); color: #fff; padding: 14px 16px 18px; display: flex; align-items: center; gap: 12px; }
  .top img { height: 42px; background: #fff; border-radius: 10px; padding: 3px; }
  .top b { display: block; font-size: 19px; } .top span { font-size: 13px; opacity: .9; }
  .lang { margin-left: auto; display: flex; background: rgba(255,255,255,.2); border-radius: 99px; padding: 3px; }
  .lang button { border: 0; background: none; color: #fff; padding: 6px 12px; border-radius: 99px; font: inherit; font-size: 14px; font-weight: 600; }
  .lang button.on { background: #fff; color: var(--c); }
  main { max-width: 640px; margin: 0 auto; padding: 14px 14px 40px; }
  .card { background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 1px 3px rgba(15,23,42,.08); margin-bottom: 14px; }
  h2 { font-size: 19px; margin: 0 0 10px; }
  .search { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; font: inherit; margin-bottom: 10px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chips button { border: 1.5px solid var(--line); background: #fff; border-radius: 99px; padding: 6px 12px; font: inherit; font-size: 14px; }
  .chips button.on { background: var(--c); border-color: var(--c); color: #fff; }
  .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .person { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; font: inherit; text-align: center; color: inherit; }
  .person:active { transform: scale(.98); } .person:hover { border-color: var(--c); }
  .ph { width: 84px; height: 105px; border-radius: 10px; object-fit: cover; background: #e2e8f0; display: grid; place-items: center; font-size: 30px; font-weight: 700; color: var(--muted); }
  .person b { font-size: 14px; line-height: 1.3; } .person small { font-size: 12px; color: var(--muted); }
  .me { display: flex; gap: 12px; align-items: center; } .me .ph { width: 64px; height: 80px; font-size: 24px; }
  .me b { font-size: 17px; display: block; } .me small { color: var(--muted); display: block; }
  .link { border: 0; background: none; color: var(--c); font: inherit; font-size: 14px; text-decoration: underline; padding: 4px 0; }
  .bal { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .bal div { background: #f8fafc; border-radius: 12px; padding: 8px; text-align: center; }
  .bal span { display: block; font-size: 12.5px; color: var(--muted); } .bal b { font-size: 22px; } .bal small { font-size: 11.5px; color: var(--muted); display: block; }
  .types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .types button { border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 12px 6px; font: inherit; font-size: 15px; font-weight: 600; min-height: 56px; }
  .types button.on { border-color: var(--c); background: #eff6ff; color: var(--c); }
  label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 4px; }
  input[type=date], textarea { width: 100%; padding: 12px; border: 1.5px solid var(--line); border-radius: 12px; font: inherit; background: #fff; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .half { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 15px; } .half input { width: 22px; height: 22px; }
  .sum { margin-top: 12px; padding: 12px; border-radius: 12px; background: #f0fdf4; border-left: 4px solid var(--ok); font-size: 15px; }
  .sum.bad { background: #fef2f2; border-color: var(--bad); } .sum.warn { background: #fffbeb; border-color: var(--warn); }
  .files { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; } .files img { width: 80px; height: 80px; object-fit: cover; border-radius: 10px; }
  .fbtn { border: 2px dashed var(--c); background: #eff6ff; color: var(--c); border-radius: 10px; width: 80px; height: 80px; font: inherit; font-size: 12px; font-weight: 600; }
  .send { width: 100%; border: 0; background: var(--c); color: #fff; border-radius: 14px; padding: 16px; font: inherit; font-size: 18px; font-weight: 700; margin-top: 16px; }
  .send:disabled { opacity: .6; }
  .err { color: var(--bad); font-size: 14.5px; margin-top: 10px; min-height: 1em; }
  .done { text-align: center; padding: 30px 16px; } .done .big { font-size: 64px; } .done b { font-size: 20px; display: block; margin: 8px 0; }
  .recent div { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding: 8px 0; font-size: 14.5px; }
  .st { font-weight: 600; white-space: nowrap; } .st.ok { color: var(--ok); } .st.no { color: var(--bad); } .st.wait { color: var(--warn); }
  .msg { text-align: center; padding: 40px 16px; color: var(--muted); }
  .spin { display: inline-block; width: 20px; height: 20px; border: 3px solid #cbd5e1; border-top-color: var(--c); border-radius: 50%; animation: s 1s linear infinite; vertical-align: -4px; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>

    Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'), function (b) { b.classList.toggle('on', b.getAttribute('data-lang') === S.lang); });
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'), function (b) { b.addEventListener('click', function () { S.lang = b.getAttribute('data-lang'); set('lang', S.lang); texts(); render(); }); });

  function render() { if (!S.data) return; if (S.done) return doneView(); if (!me()) return pickView(); formView(); }
  function pickView() {
    var q = String(S.q || '').toLowerCase(), grps = S.data.emps.map(function (e) { return e.building || e.group; }).filter(function (x, i, a) { return x && a.indexOf(x) === i; });
    var list = S.data.emps.filter(function (e) { return (!S.grp || (e.building || e.group) === S.grp) && (!q || (e.name + ' ' + e.nick).toLowerCase().indexOf(q) >= 0); });
    $('app').innerHTML = '<div class="card"><h2>' + t('pick') + '</h2><input class="search" id="q" type="search" placeholder="' + esc(t('search')) + '" value="' + esc(S.q || '') + '">'
      + '<div class="chips"><button data-g=""' + (S.grp ? '' : ' class="on"') + '>' + t('all') + '</button>' + grps.map(function (g) { return '<button data-g="' + esc(g) + '"' + (S.grp === g ? ' class="on"' : '') + '>' + esc(g) + '</button>'; }).join('') + '</div>'
      + '<div class="people">' + list.map(function (e) { return '<button class="person" data-id="' + e.id + '">' + ph(e) + '<b>' + esc(e.nick || e.name) + '</b><small>' + esc(e.nick ? e.name : (e.position || '')) + '</small></button>'; }).join('') + '</div></div>';
    $('q').addEventListener('input', function () { S.q = $('q').value; clearTimeout(S.qt); S.qt = setTimeout(function () { pickView(); var i = $('q'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 200); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-g]'), function (b) { b.addEventListener('click', function () { S.grp = b.getAttribute('data-g'); pickView(); }); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-id]'), function (b) { b.addEventListener('click', function () { S.me = b.getAttribute('data-id'); set('me', S.me); S.bal = null; render(); window.scrollTo(0, 0); }); });
  }
  function workDays(f, to) { var n = 0, d = new Date(f + 'T00:00:00'), e = new Date(to + 'T00:00:00'); while (d <= e) { var w = d.getDay(); if (w !== 0 && !(S.data.workDays === 'จ-ศ' && w === 6)) n++; d.setDate(d.getDate() + 1); } return n; }
  function formView() {
    var e = me(), F = S.f, today = S.data.today;
    if (!F.from) { F.from = today; F.to = today; }
    if (!S.bal) { S.bal = 'loading'; call('hrFormBalance', KEY, e.id).then(function (r) { S.bal = r.ok ? r : null; if (!S.done) formView(); }).catch(function () { S.bal = null; }); }
    var B = S.bal && S.bal.balance;
    var n = F.half && F.from === F.to ? 0.5 : (F.from && F.to && F.to >= F.from ? workDays(F.from, F.to) : 0);
    var sum = '';
    if (F.type && n) {
      var b = B && B[F.type], after = b && b.quota != null ? b.left - b.pending - n : null;
      sum = '<div class="sum' + (after != null && after < 0 ? ' bad' : '') + '">' + t('total') + ' <b>' + n + '</b> ' + t('days') + (after != null ? ' · ' + (after < 0 ? t('overQ') + ' <b>' + (-after) + '</b> ' + t('days') : t('willLeft') + ' <b>' + after + '</b> ' + t('days')) : '') + '</div>';
    }
    $('app').innerHTML = '<div class="card"><div class="me">' + ph(e) + '<div><b>' + esc(e.name) + '</b><small>' + esc([e.nick, e.position].filter(String).join(' · ')) + '</small><button class="link" id="notMe">' + t('notMe') + '</button></div></div>'
      + '<div class="bal">' + ['sick', 'personal', 'vacation'].map(function (k) { var b = B && B[k]; return '<div><span>' + t('types')[k] + '</span><b>' + (b && b.quota != null ? b.left : (S.bal === 'loading' ? '…' : '–')) + '</b><small>' + t('left') + ' (' + t('days') + ')' + (b && b.pending ? ' · ' + t('pending') + ' ' + b.pending : '') + '</small></div>'; }).join('') + '</div></div>'
      + '<div class="card"><h2>' + t('type') + '</h2><div class="types">' + ['sick', 'personal', 'vacation', 'maternity', 'ordain', 'other'].map(function (k) { return '<button data-type="' + k + '"' + (F.type === k ? ' class="on"' : '') + '>' + t('types')[k] + '</button>'; }).join('') + '</div>'
      + '<div class="row2"><div><label>' + t('from') + '</label><input type="date" id="fFrom" value="' + F.from + '"></div><div><label>' + t('to') + '</label><input type="date" id="fTo" value="' + F.to + '" min="' + F.from + '"></div></div>'
      + (F.from === F.to ? '<label class="half"><input type="checkbox" id="fHalf"' + (F.half ? ' checked' : '') + '> ' + t('half') + '</label>' : '')
      + '<label>' + t('reason') + '</label><textarea id="fReason" rows="2" placeholder="' + esc(t('reasonPh')) + '">' + esc(F.reason) + '</textarea>'
      + '<label>' + t('file') + '</label><div class="files">' + F.files.map(function (x, i) { return '<img src="' + x.url + '" data-rm="' + i + '" alt="">'; }).join('') + (F.files.length < 3 ? '<button class="fbtn" data-pick="cam">📷<br>' + t('cam') + '</button><button class="fbtn" data-pick="lib">🖼️<br>' + t('lib') + '</button>' : '') + '</div>'
      + sum + '<div class="err" id="err"></div><button class="send" id="send">' + t('send') + '</button></div>'
      + recentHtml();
    $('notMe').addEventListener('click', function () { S.me = ''; set('me', ''); S.bal = null; render(); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-type]'), function (b) { b.addEventListener('click', function () { F.type = b.getAttribute('data-type'); formView(); }); });
    $('fFrom').addEventListener('change', function () { F.from = $('fFrom').value; if (!F.to || F.to < F.from) F.to = F.from; formView(); });
    $('fTo').addEventListener('change', function () { F.to = $('fTo').value; formView(); });
    if ($('fHalf')) $('fHalf').addEventListener('change', function () { F.half = $('fHalf').checked; formView(); });
    $('fReason').addEventListener('input', function () { F.reason = $('fReason').value; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-pick]'), function (b) { b.addEventListener('click', function () { pick(b.getAttribute('data-pick') === 'cam'); }); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-rm]'), function (im) { im.addEventListener('click', function () { if (confirm('ลบรูป?')) { F.files.splice(+im.getAttribute('data-rm'), 1); formView(); } }); });
    $('send').addEventListener('click', submit);
  }
  function recentHtml() {
    var r = S.bal && S.bal.recent; if (!r) return '';
    return '<div class="card recent"><h2>' + t('recent') + '</h2>' + (r.map(function (l) {
      var c = l.status === 'อนุมัติ' ? 'ok' : l.status === 'ไม่อนุมัติ' ? 'no' : 'wait';
      return '<div><span>' + esc(t('types')[l.type] || l.type) + ' · ' + dmy(l.dateFrom) + (l.dateTo && l.dateTo !== l.dateFrom ? '–' + dmy(l.dateTo) : '') + ' (' + l.days + ')</span><span class="st ' + c + '">' + esc(t('st')[l.status] || l.status) + '</span></div>';
    }).join('') || '<div>' + t('none') + '</div>') + '</div>';
  }
  function pick(cam) {
    var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*,application/pdf';
    if (cam) inp.setAttribute('capture', 'environment'); else inp.multiple = true;
    inp.style.display = 'none'; document.body.appendChild(inp);
    inp.addEventListener('change', function () {
      var files = Array.prototype.slice.call(inp.files || []).slice(0, 3 - S.f.files.length); document.body.removeChild(inp);
      Promise.all(files.map(prep)).then(function (arr) { S.f.files = S.f.files.concat(arr.filter(Boolean)).slice(0, 3); formView(); });
    });
    inp.click();
  }
  function prep(file) {
    if (file.type === 'application/pdf') return new Promise(function (res) { var r = new FileReader(); r.onload = function () { res({ b64: String(r.result).split(',')[1], mime: 'application/pdf', name: file.name, url: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" fill="#fee2e2"/><text x="40" y="46" font-size="18" text-anchor="middle" fill="#b91c1c">PDF</text></svg>') }); }; r.readAsDataURL(file); });
    return new Promise(function (res) {
      var u = URL.createObjectURL(file), im = new Image();
      im.onload = function () { var k = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); var d = c.toDataURL('image/jpeg', 0.82); res({ b64: d.split(',')[1], mime: 'image/jpeg', name: 'doc.jpg', url: d }); };
      im.onerror = function () { URL.revokeObjectURL(u); res(null); }; im.src = u;
    });
  }
  function submit() {
    var F = S.f, err = $('err'), btn = $('send');
    if (!F.type) { err.textContent = t('needType'); return; }
    if (!F.from) { err.textContent = t('needDate'); return; }
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; err.textContent = '';
    call('hrFormSubmit', KEY, { empId: S.me, type: F.type, dateFrom: F.from, dateTo: F.to || F.from, half: F.half && F.from === F.to, reason: F.reason }).then(function (r) {
      var i = 0;
      function next() { if (i >= F.files.length) return Promise.resolve(); var x = F.files[i++]; return call('hrFormUpload', KEY, r.id, r.sig, x.name, x.mime, x.b64).catch(function () {}).then(next); }
      return next().then(function () { S.done = { days: r.days }; S.f = { type: '', from: '', to: '', half: false, reason: '', files: [] }; S.bal = null; render(); window.scrollTo(0, 0); });
    }).catch(function (e) { btn.disabled = false; btn.textContent = t('send'); err.textContent = e.message; });
  }
  function doneView() {
    $('app').innerHTML = '<div class="card done"><div class="big">✅</div><b>' + t('sent') + '</b><p>' + t('sentSub') + '</p><button class="send" id="again">' + t('again') + '</button></div>';
    $('again').addEventListener('click', function () { S.done = null; render(); });
  }

  texts();
  if (!KEY) { $('app').innerHTML = '<div class="msg">' + t('badLink') + '</div>'; return; }
  call('hrFormInit', KEY).then(function (d) {
    S.data = d; render();
    call('hrFormPhotos', KEY).then(function (p) { S.photos = p.photos || {}; render(); }).catch(function () {});
  }).catch(function (e) { $('app').innerHTML = '<div class="msg">' + esc(e.message) + '</div>'; });
})();
</script>
</body>
</html>
