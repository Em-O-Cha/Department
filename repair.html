<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>แจ้งซ่อม · Spunky Food</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --c: #475569; --c2: #334155; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --bg: #f1f5f9; --ok: #16a34a; --bad: #dc2626; --warn: #d97706; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans Thai', 'Noto Sans Myanmar', system-ui, sans-serif; font-size: 16px; }
  body.my { font-family: 'Noto Sans Myanmar', 'IBM Plex Sans Thai', system-ui, sans-serif; }
  .top { background: linear-gradient(135deg, #334155, #64748b); color: #fff; padding: 14px 16px 18px; display: flex; align-items: center; gap: 12px; }
  .top img { height: 42px; background: #fff; border-radius: 10px; padding: 3px; }
  .top b { display: block; font-size: 19px; } .top span { font-size: 13px; opacity: .92; }
  .lang { margin-left: auto; display: flex; background: rgba(255,255,255,.2); border-radius: 99px; padding: 3px; }
  .lang button { border: 0; background: none; color: #fff; padding: 6px 12px; border-radius: 99px; font: inherit; font-size: 14px; font-weight: 600; }
  .lang button.on { background: #fff; color: var(--c2); }
  main { max-width: 640px; margin: 0 auto; padding: 14px 14px 40px; }
  .card { background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 1px 3px rgba(15,23,42,.08); margin-bottom: 14px; }
  h2 { font-size: 19px; margin: 0 0 10px; } h3 { font-size: 16px; margin: 0 0 8px; }
  label { display: block; font-size: 14px; color: #475569; font-weight: 600; margin: 14px 0 6px; }
  label .req { color: var(--bad); }
  input[type=text], input[type=tel], input[type=number], input[type=search], textarea, select { width: 100%; padding: 12px; border: 1.5px solid var(--line); border-radius: 12px; font: inherit; background: #fff; color: inherit; min-height: 48px; }
  textarea { min-height: 84px; resize: vertical; }
  input:focus, textarea:focus, select:focus { outline: 2px solid #94a3b8; border-color: var(--c2); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button { border: 1.5px solid var(--line); background: #fff; border-radius: 99px; padding: 8px 13px; font: inherit; font-size: 14.5px; color: inherit; min-height: 40px; }
  .chips button.on { background: var(--c2); border-color: var(--c2); color: #fff; }
  .chips button.on::before { content: '✓ '; }
  .urg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .urg button { border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 4px; font: inherit; font-size: 14px; font-weight: 600; min-height: 54px; color: inherit; line-height: 1.25; }
  .urg button.on { color: #fff; border-color: var(--u); background: var(--u); }
  .stop { display: flex; gap: 10px; align-items: center; margin-top: 10px; padding: 12px; border: 2px solid var(--line); border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .stop input { width: 24px; height: 24px; flex: none; accent-color: var(--bad); }
  .stop.on { border-color: var(--bad); background: #fef2f2; color: #991b1b; }
  .mlist { max-height: 280px; overflow: auto; border: 1.5px solid var(--line); border-radius: 12px; margin-top: 8px; }
  .mi { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: #fff; padding: 11px 12px; font: inherit; color: inherit; }
  .mi:last-child { border-bottom: 0; } .mi small { display: block; color: var(--muted); font-size: 12.5px; }
  .mi.on { background: #f1f5f9; box-shadow: inset 4px 0 0 var(--c2); } .mi.on b::before { content: '✓ '; color: var(--ok); }
  .picked { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 12px; border: 2px solid var(--c2); border-radius: 12px; background: #f8fafc; }
  .picked b { display: block; } .picked small { color: var(--muted); }
  .link { border: 0; background: none; color: #1d4ed8; font: inherit; font-size: 14px; text-decoration: underline; padding: 6px 0; cursor: pointer; }
  .files { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; } .files span { position: relative; } .files img { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; display: block; }
  .files .x { position: absolute; top: -8px; right: -8px; width: 34px; height: 34px; border-radius: 50%; border: 2px solid #fff; background: #0f172a; color: #fff; font-size: 15px; line-height: 30px; padding: 0; }
  .fbtn { border: 2px dashed #94a3b8; background: #f8fafc; color: #334155; border-radius: 10px; width: 84px; height: 84px; font: inherit; font-size: 12px; font-weight: 600; }
  .send { width: 100%; border: 0; background: var(--c2); color: #fff; border-radius: 14px; padding: 16px; font: inherit; font-size: 18px; font-weight: 700; margin-top: 16px; min-height: 56px; }
  .send.ok { background: var(--ok); } .send:disabled { opacity: .6; }
  .btn2 { border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 12px; font: inherit; font-weight: 600; color: inherit; min-height: 48px; }
  .err { color: var(--bad); font-size: 15px; font-weight: 600; margin-top: 10px; }
  .err:not(:empty) { background: #fef2f2; border: 1px solid #fca5a5; border-radius: 10px; padding: 8px 12px; }
  .need { outline: 3px solid var(--bad); outline-offset: 3px; border-radius: 12px; animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .done { text-align: center; padding: 26px 16px; } .done .big { font-size: 60px; } .done b { font-size: 20px; display: block; margin: 6px 0; } .done p { color: #475569; margin: 6px 0; }
  .code { display: inline-block; font-weight: 700; background: #f1f5f9; border-radius: 8px; padding: 2px 10px; letter-spacing: .5px; }
  .mine { border-top: 1px solid var(--line); padding: 12px 0; display: flex; gap: 10px; }
  .mine:first-of-type { border-top: 0; } .mine img { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; flex: none; }
  .mine .mt { flex: 1; min-width: 0; } .mine .mt b { display: block; } .mine .mt small { display: block; color: var(--muted); font-size: 13px; }
  .stp { display: inline-block; font-size: 12.5px; font-weight: 700; border-radius: 99px; padding: 2px 10px; margin-top: 4px; }
  .s-new { background: #fff7ed; color: #c2410c; } .s-accepted, .s-doing { background: #eff6ff; color: #1d4ed8; } .s-wait { background: #fefce8; color: #a16207; }
  .s-done { background: #f0fdf4; color: #15803d; } .s-closed { background: #f1f5f9; color: #475569; } .s-cancel { background: #f1f5f9; color: #94a3b8; }
  .cfm { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; } .cfm button { min-height: 46px; border-radius: 12px; font: inherit; font-weight: 700; border: 2px solid var(--line); background: #fff; }
  .cfm .y { background: var(--ok); border-color: var(--ok); color: #fff; } .cfm .n { color: var(--bad); border-color: #fecaca; }
  .msg { text-align: center; padding: 40px 16px; color: var(--muted); }
  .spin { display: inline-block; width: 20px; height: 20px; border: 3px solid #cbd5e1; border-top-color: var(--c2); border-radius: 50%; animation: s 1s linear infinite; vertical-align: -4px; }
  @keyframes s { to { transform: rotate(360deg); } }
  .busyov { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(15, 23, 42, .28); }
  .busybox { display: flex; gap: 14px; align-items: center; background: #fff; border-radius: 18px; padding: 18px 22px; box-shadow: 0 12px 40px rgba(15, 23, 42, .25); max-width: 360px; width: 100%; }
  .busybox b { display: block; font-size: 16px; } .busybox small { color: var(--muted); font-size: 13px; }
  .busysp { width: 30px; height: 30px; flex: 0 0 auto; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--c2); animation: s .8s linear infinite; }
  .toastm { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #166534; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14.5px; z-index: 99; max-width: 90vw; box-shadow: 0 8px 24px rgba(0,0,0,.2); } .toastm.bad { background: #b91c1c; }
  /* หน้าช่าง */
  .hd { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; } .hd b { font-size: 18px; display: block; } .hd small { color: var(--muted); display: block; }
  .tag { font-size: 12.5px; font-weight: 700; border-radius: 99px; padding: 3px 10px; white-space: nowrap; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 10px; font-size: 14.5px; margin-top: 10px; } .kv span { color: var(--muted); }
  .prob { background: #f8fafc; border-radius: 10px; padding: 10px 12px; margin-top: 10px; white-space: pre-wrap; font-size: 15px; }
  .gal { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; } .gal a img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; display: block; }
  .sts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .sts button { min-height: 52px; border: 2px solid var(--line); background: #fff; border-radius: 12px; font: inherit; font-weight: 700; color: inherit; }
  .sts button.on { color: #fff; border-color: var(--u); background: var(--u); } .sts button.on::before { content: '✓ '; }
  .prow { display: grid; grid-template-columns: minmax(0, 1fr) 84px 40px; gap: 6px; align-items: center; margin-top: 6px; }
  .prow input, .prow select { min-height: 44px; padding: 8px 10px; } .prow .rm { height: 44px; border: 1.5px solid #fecaca; color: var(--bad); background: #fff; border-radius: 10px; font-size: 18px; }
  .prow small { grid-column: 1 / -1; color: var(--muted); font-size: 12.5px; margin-top: -2px; }
  .tl { font-size: 13.5px; color: #475569; border-left: 3px solid var(--line); padding-left: 10px; margin-top: 8px; } .tl div { padding: 3px 0; } .tl small { color: var(--muted); }
  .sumc { margin-top: 10px; padding: 10px 12px; background: #f8fafc; border-radius: 10px; font-size: 15px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .row2 > div { min-width: 0; }
  .note { font-size: 13.5px; color: #475569; background: #f8fafc; border-radius: 10px; padding: 8px 10px; margin-top: 8px; }
</style>
</head>

    return '<div class="card" id="mineCard"><div class="hd"><h2 style="margin:0">' + t('mine') + '</h2><button type="button" class="link" id="mRef">' + t('refresh') + '</button></div>'
      + (a.length ? a.map(function (r) {
        return '<div class="mine">' + (r.after || r.photo ? '<img src="' + esc((r.after || r.photo) + '=w160') + '" alt="">' : '') + '<div class="mt"><b>' + esc(r.machineName || r.location || '-') + '</b><small>' + esc(r.code) + ' · ' + dt(r.reportAt) + '</small>'
          + '<span class="stp s-' + r.status + '">' + esc(t('st')[r.status] || r.statusText) + '</span>' + (r.assignee ? '<small>' + t('by') + ': ' + esc(r.assignee) + '</small>' : '') + (r.fix && (r.status === 'done' || r.status === 'closed') ? '<small>' + t('fix') + ': ' + esc(r.fix) + '</small>' : '')
          + (r.status === 'done' ? '<div class="cfm"><button type="button" class="n" data-cf="' + esc(r.id) + '|0">' + t('no') + '</button><button type="button" class="y" data-cf="' + esc(r.id) + '|1">' + t('ok') + '</button></div>' : '') + '</div></div>';
      }).join('') : '<div class="msg" style="padding:12px"><span class="spin"></span></div>') + '</div>';
  }
  function bindMine() {
    if ($('mRef')) $('mRef').addEventListener('click', loadMine);
    on('[data-cf]', 'click', function (b) {
      var p = b.getAttribute('data-cf').split('|'), it = jget('mine', []).filter(function (x) { return x.id === p[0]; })[0]; if (!it) return;
      Array.prototype.forEach.call(document.querySelectorAll('[data-cf^="' + p[0] + '"]'), function (x) { x.disabled = true; });
      call('mntFormConfirm', it.id, it.s, p[1] === '1', '').then(function (r) { if (!r.ok) throw new Error(r.error); toast(p[1] === '1' ? t('thanks') : t('reopened')); loadMine(); })
        .catch(function (e) { toast(nice(e), true); loadMine(); });
    });
  }
  function loadMine() {
    var m = jget('mine', []); if (!m.length) return;
    call('mntFormMine', m).then(function (r) {
      S.mine = r.list || [];
      var ids = S.mine.map(function (x) { return x.id; }); jset('mine', m.filter(function (x) { return ids.indexOf(x.id) >= 0; }));   // ใบที่ถูกลบไม่ต้องจำ
      var a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) { var c = $('mineCard'); if (c) { c.outerHTML = mineHtml(); bindMine(); } return; }   // กำลังพิมพ์ → อัปเดตเฉพาะกล่องนี้
      var y = window.scrollY; render(); window.scrollTo(0, y);
    }).catch(function () {});
  }

  // ==================== หน้าช่าง (ลิงก์จากการ์ดในกลุ่ม LINE) ====================
  var TST = [['accepted', 'รับงานแล้ว', '#2563eb'], ['doing', 'กำลังซ่อม', '#1d4ed8'], ['wait', 'รออะไหล่ / ช่างนอก', '#a16207'], ['done', 'ซ่อมเสร็จ', '#16a34a']];
  var STC = { 'new': ['#fff7ed', '#c2410c'], accepted: ['#eff6ff', '#1d4ed8'], doing: ['#eff6ff', '#1d4ed8'], wait: ['#fefce8', '#a16207'], done: ['#f0fdf4', '#15803d'], closed: ['#f1f5f9', '#475569'], cancel: ['#f1f5f9', '#94a3b8'] };
  function techView() {
    var T = S.tech; if (!T) return;
    var r = T.repair, U = T.u, lock = r.status === 'closed' || r.status === 'cancel', c = STC[r.status] || STC['new'];
    var parts = T.parts || [], pOpt = function (sel) { return '<option value="">— อะไหล่ในสต๊อก —</option>' + parts.map(function (p) { return '<option value="' + esc(p.id) + '"' + (sel === p.id ? ' selected' : '') + '>' + esc(p.name) + ' (เหลือ ' + p.balance + ' ' + esc(p.unit) + ')</option>'; }).join('') + '<option value="__other"' + (sel === '__other' ? ' selected' : '') + '>อื่น ๆ (ซื้อมาใช้เลย)</option>'; };
    var cost = U.parts.reduce(function (s, x) { return s + (Number(x.qty) || 0) * (Number(x.price) || 0); }, 0) + (Number(U.outsideCost) || 0);
    var gal = function (a) { return a && a.length ? '<div class="gal">' + a.map(function (f) { return '<a href="' + esc(f.url) + '" target="_blank" rel="noopener"><img src="' + esc(f.url) + '=w240" alt="" loading="lazy"></a>'; }).join('') + '</div>' : ''; };
    var html = '<div class="card"><div class="hd"><div><b>' + esc(r.machineName || r.location || '-') + '</b><small>' + esc(r.code) + ' · ' + dt(r.reportAt) + '</small></div><span class="tag" style="background:' + c[0] + ';color:' + c[1] + '">' + esc(T.statuses[r.status]) + '</span></div>'
      + '<div class="prob">' + esc(r.problem) + '</div>' + gal(r.photos)
      + '<div class="kv"><span>อาคาร / จุด</span><b>' + esc([r.building, r.location].filter(String).join(' · ') || '-') + '</b><span>ประเภท</span><b>' + esc(r.category || '-') + '</b>'
      + '<span>ความเร่งด่วน</span><b style="color:' + (URGC[r.urgency] || '#334155') + '">' + esc(T.urgency[r.urgency] || '') + (r.stopLine ? ' · ⛔ กระทบการผลิต' : '') + '</b>'
      + '<span>ผู้แจ้ง</span><b>' + esc([r.reporter, r.reporterDept].filter(String).join(' · ')) + (r.phone ? ' · <a href="tel:' + esc(r.phone) + '">' + esc(r.phone) + '</a>' : '') + '</b></div>'
      + (r.timeline && r.timeline.length ? '<div class="tl">' + r.timeline.slice(-6).map(function (x) { return '<div>' + esc(x.t) + ' <small>· ' + dt(x.at) + (x.by ? ' · ' + esc(x.by) : '') + '</small></div>'; }).join('') + '</div>' : '') + '</div>';
    if (lock) {
      html += '<div class="card"><h3>' + (r.status === 'closed' ? '✅ ปิดงานแล้ว' : 'ยกเลิกแล้ว') + '</h3>' + (r.fix ? '<div class="note"><b>วิธีแก้:</b> ' + esc(r.fix) + '</div>' : '') + gal(r.afterPhotos) + '<p class="note">แก้ไขต่อได้ในระบบฝ่ายช่าง (เว็บ) เท่านั้น</p></div>';
      $('app').innerHTML = html; return;
    }
    html += '<div class="card"><h2>อัปเดตงาน</h2>'
      + '<label for="uBy">ช่างผู้ซ่อม <span class="req">*</span></label>' + (T.techs.length ? '<select id="uBy"><option value="">— เลือกชื่อ —</option>' + T.techs.concat(U.assignee && T.techs.indexOf(U.assignee) < 0 ? [U.assignee] : []).map(function (x) { return '<option' + (U.assignee === x ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('') + '</select>' : '<input type="text" id="uBy" value="' + esc(U.assignee) + '">')
      + '<label>สถานะ</label><div class="sts" id="uSt">' + TST.map(function (s) { return '<button type="button" data-st="' + s[0] + '" style="--u:' + s[2] + '"' + (U.status === s[0] ? ' class="on"' : '') + '>' + s[1] + '</button>'; }).join('') + '</div>'
      + '<label for="uCause">สาเหตุ</label><textarea id="uCause" rows="2" placeholder="เช่น ลูกปืนแตก สายไฟหลวม">' + esc(U.cause) + '</textarea>'
      + '<label for="uFix">วิธีแก้ไข' + (U.status === 'done' ? ' <span class="req">*</span>' : '') + '</label><textarea id="uFix" rows="2" placeholder="เช่น เปลี่ยนลูกปืน ขันขั้วสายไฟใหม่">' + esc(U.fix) + '</textarea>'
      + '<label for="uDown">เวลาหยุดเครื่อง (นาที)</label><input type="number" id="uDown" inputmode="numeric" min="0" value="' + esc(U.downtimeMin) + '" placeholder="' + (r.stopLine ? 'ไม่ใส่ = นับจากเวลาแจ้งถึงซ่อมเสร็จ' : 'ถ้าเครื่องหยุด') + '">'
      + '<label>อะไหล่ / วัสดุที่ใช้</label><div id="uParts">' + U.parts.map(function (x, i) {
        var other = !x.partId && !x.stock;
        return '<div class="prow" data-i="' + i + '">' + (other ? '<input type="text" data-k="name" placeholder="ชื่ออะไหล่ / วัสดุ" value="' + esc(x.name) + '">' : '<select data-k="partId">' + pOpt(x.partId) + '</select>')
          + '<input type="number" inputmode="decimal" min="0" step="any" data-k="qty" placeholder="จำนวน" value="' + esc(x.qty) + '"><button type="button" class="rm" data-rmp="' + i + '" aria-label="ลบ">✕</button>'
          + (other ? '<input type="number" inputmode="decimal" min="0" step="any" data-k="price" placeholder="ราคาต่อหน่วย (บาท)" value="' + esc(x.price) + '" style="grid-column:1/3">' : '<small>' + esc(x.unit || '') + (x.price ? ' · ' + Number(x.price).toLocaleString() + ' บาท/หน่วย' : '') + '</small>') + '</div>';
      }).join('') + '</div><div class="row2" style="margin-top:8px"><button type="button" class="btn2" id="aPart">+ อะไหล่ในสต๊อก</button><button type="button" class="btn2" id="aOther">+ ซื้อมาใช้เลย</button></div>'
      + '<div class="row2"><div><label for="uOut">ค่าจ้างภายนอก (บาท)</label><input type="number" id="uOut" inputmode="decimal" min="0" step="any" value="' + esc(U.outsideCost) + '"></div><div><label for="uVen">ร้าน / ผู้รับเหมา</label><input type="text" id="uVen" value="' + esc(U.outsideVendor) + '"></div></div>'
      + (cost ? '<div class="sumc">ค่าใช้จ่ายรวม <b>' + cost.toLocaleString(undefined, { maximumFractionDigits: 2 }) + ' บาท</b></div>' : '')
      + '<label>รูปหลังซ่อม</label><div class="files">' + (r.afterPhotos || []).map(function (f) { return '<span><img src="' + esc(f.url) + '=w200" alt=""></span>'; }).join('') + U.photos.map(function (p, i) { return '<span><img src="' + p.url + '" alt=""><button type="button" class="x" data-rmf="' + i + '" aria-label="ลบรูป">✕</button></span>'; }).join('')
      + ((r.afterPhotos || []).length + U.photos.length < 8 ? '<button type="button" class="fbtn" data-tp="cam">📷<br>ถ่ายรูป</button><button type="button" class="fbtn" data-tp="lib">🖼️<br>เลือกรูป</button>' : '') + '</div>'
      + '<label for="uNote">หมายเหตุ</label><textarea id="uNote" rows="2">' + esc(U.note) + '</textarea>'
      + '<div class="err" id="err" role="alert"></div><button type="button" class="send' + (U.status === 'done' ? ' ok' : '') + '" id="uSave">' + (U.status === 'done' ? '✅ บันทึก · ซ่อมเสร็จ' : '💾 บันทึก') + '</button></div>';
    $('app').innerHTML = html;
    var bind = function (id, k) { var el = $(id); if (el) el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', function () { U[k] = el.value; if (k === 'assignee') set('tech', el.value); if (k === 'outsideCost') techView(); }); };
    bind('uBy', 'assignee'); bind('uCause', 'cause'); bind('uFix', 'fix'); bind('uDown', 'downtimeMin'); bind('uVen', 'outsideVendor'); bind('uNote', 'note');
    $('uOut').addEventListener('change', function () { U.outsideCost = this.value; techView(); });
    on('[data-st]', 'click', function (b) { U.status = b.getAttribute('data-st'); techView(); });
    on('#uParts [data-k]', 'change', function (el) {
      var i = +el.closest('.prow').getAttribute('data-i'), k = el.getAttribute('data-k'), x = U.parts[i];
      if (k === 'partId') { if (el.value === '__other') { U.parts[i] = { partId: '', name: '', qty: x.qty, price: '' }; } else if (!el.value) { x.partId = ''; x.name = ''; x.stock = 1; } else { var p = parts.filter(function (y) { return y.id === el.value; })[0]; x.partId = el.value; x.name = p ? p.name : ''; x.unit = p ? p.unit : ''; x.price = p ? p.price : ''; } }
      else x[k] = el.value;
      techView();
    });
    on('#uParts input[data-k="name"]', 'input', function (el) { U.parts[+el.closest('.prow').getAttribute('data-i')].name = el.value; });
    on('[data-rmp]', 'click', function (b) { U.parts.splice(+b.getAttribute('data-rmp'), 1); techView(); });
    $('aPart').addEventListener('click', function () { U.parts.push({ partId: '', name: '', qty: 1, price: '', stock: 1 }); techView(); });
    $('aOther').addEventListener('click', function () { U.parts.push({ partId: '', name: '', qty: 1, price: '' }); techView(); });
    on('[data-rmf]', 'click', function (b) { U.photos.splice(+b.getAttribute('data-rmf'), 1); techView(); });
    on('[data-tp]', 'click', function (b) { pickPhotos(b.getAttribute('data-tp') === 'cam', 8 - (r.afterPhotos || []).length - U.photos.length, function (a) { U.photos = U.photos.concat(a); techView(); }); });
    $('uSave').addEventListener('click', techSave);
  }
  function techSave() {
    var T = S.tech, U = T.u, btn = $('uSave');
    var fail2 = function (m, sel) { fail(m, sel); };
    if ((U.status === 'doing' || U.status === 'wait' || U.status === 'done') && !String(U.assignee).trim()) return fail2('เลือกชื่อช่างผู้ซ่อม', '#uBy');
    if (U.status === 'done' && !String(U.fix).trim()) return fail2('ใส่วิธีแก้ไข ก่อนบันทึกว่าซ่อมเสร็จ', '#uFix');
    var bad = U.parts.filter(function (x) { return (x.partId || x.name) && !(Number(x.qty) > 0); })[0];
    if (bad) return fail2('ใส่จำนวนอะไหล่ที่ใช้', '#uParts');
    btn.disabled = true; btn.innerHTML = '<span class="spin" style="border-top-color:#fff"></span> กำลังบันทึก…'; $('err').textContent = '';
    var used = U.parts.filter(function (x) { return x.partId || String(x.name || '').trim(); }).map(function (x) { return { partId: x.partId, name: x.name, qty: x.qty, unit: x.unit, price: x.price }; });
    call('mntTechUpdate', RID, TSIG, { status: U.status, assignee: U.assignee, cause: U.cause, fix: U.fix, downtimeMin: U.downtimeMin, outsideCost: U.outsideCost, outsideVendor: U.outsideVendor, partsUsed: used, note: U.note },
      U.photos.map(function (p) { return { name: p.name, mime: p.mime, b64: p.b64 }; })).then(function (r) {
      if (!r.ok) throw new Error(r.error);
      toast(r.status === 'done' ? '✅ บันทึกแล้ว · แจ้งผู้แจ้งให้ตรวจรับ' : '✅ บันทึกแล้ว');
      if (r.line) toast('LINE: ' + r.line, true);
      loadTech();
    }).catch(function (e) { btn.disabled = false; btn.textContent = '💾 บันทึก'; fail2(nice(e)); });
  }
  function loadTech() {
    call('mntTechView', RID, TSIG).then(function (r) {
      if (!r.ok) throw new Error(r.error);
      var x = r.repair;
      r.u = { status: x.status === 'new' ? 'accepted' : x.status, assignee: x.assignee || get('tech'), cause: x.cause || '', fix: x.fix || '', downtimeMin: x.downtimeMin === '' || x.downtimeMin == null ? '' : x.downtimeMin,
        outsideCost: x.outsideCost || '', outsideVendor: x.outsideVendor || '', note: x.note || '', photos: [], parts: (x.partsUsed || []).map(function (p) { return { partId: p.partId, name: p.name, qty: p.qty, unit: p.unit, price: p.price }; }) };
      S.tech = r; techView(); window.scrollTo(0, 0);
    }).catch(function (e) { $('app').innerHTML = '<div class="msg">' + esc(nice(e)) + '<br><button class="send" style="margin-top:12px" onclick="location.reload()">↻</button></div>'; });
  }

  // ==================== เริ่ม ====================
  texts();
  if (RID) { $('lang').style.display = 'none'; if (!TSIG) { $('app').innerHTML = '<div class="msg">' + t('badLink') + '</div>'; return; } loadTech(); return; }
  if (!KEY) { $('app').innerHTML = '<div class="msg">' + t('badLink') + '</div>'; return; }
  // เปิดจากปุ่มเมนู LINE (LIFF): รู้บัญชี LINE ผู้แจ้ง → ซ่อมเสร็จแล้วแจ้งกลับได้ · เปิดจาก QR = ไม่ต้องมี LINE
  if (LIFF) {
    S.tokP = new Promise(function (res) {
      var sc = document.createElement('script'); sc.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
      sc.onload = function () {
        window.liff.init({ liffId: LIFF }).then(function () {
          if (!window.liff.isLoggedIn()) { if (window.liff.isInClient()) window.liff.login(); return res(''); }
          var d = window.liff.getDecodedIDToken() || {};
          if (d.name) { S.lineName = d.name; if (!S.f.reporter) S.f.reporter = d.name; if (S.data && !S.done && !document.activeElement.matches('input,textarea')) render(); }
          res(window.liff.getIDToken() || '');
        }).catch(function () { res(''); });
      };
      sc.onerror = function () { res(''); };
      document.head.appendChild(sc);
      setTimeout(function () { res(''); }, 8000);
    });
  }
  // ข้อมูลครั้งก่อนในเครื่อง → ขึ้นหน้าทันที แล้วโหลดใหม่เงียบ ๆ (เหมือนหน้าขอลา)
  var ci = jget('init_' + KEY, null);
  if (ci && ci.machines) { S.data = ci; render(); }
  call('mntFormInit', KEY).then(function (d) {
    jset('init_' + KEY, d);
    var was = JSON.stringify(S.data && S.data.machines) + JSON.stringify(S.data && [S.data.categories, S.data.buildings, S.data.depts]), first = !S.data;
    S.data = d;
    if (first) render();
    else if (was !== JSON.stringify(d.machines) + JSON.stringify([d.categories, d.buildings, d.depts]) && !S.done) { var a = document.activeElement; if (!(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) { var y = window.scrollY; render(); window.scrollTo(0, y); } }
  }).catch(function (e) { if (!S.data) $('app').innerHTML = '<div class="msg">' + esc(nice(e)) + '<br><button class="send" style="margin-top:12px" onclick="location.reload()">↻</button></div>'; });
  loadMine();
})();
</script>
</body>
</html>
